# Publica Grafana en http://grafana.local a través del Gateway «publico» de Traefik
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitorizacion
spec:
  parentRefs:
    - name: publico
      namespace: traefik
  hostnames: ["grafana.local"]
  rules:
    - backendRefs:
        - name: kps-grafana
          port: 80
