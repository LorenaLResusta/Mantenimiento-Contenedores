# Servidor web de BiciAlacant: sirve la página y reenvía /api/ al servicio de la API.
# La imagen nginxinc/nginx-unprivileged escucha en el 8080 y no se ejecuta como root.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # «api» se resuelve por el DNS interno (Compose o Kubernetes)
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
    }

    location = /nginx-salud {
        access_log off;
        return 200 "ok\n";
    }
}
