<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BiciAlacant</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 52rem; margin: 2rem auto; padding: 0 1rem; color: #1d2a36; }
    h1 { color: #0b6e8a; } table { border-collapse: collapse; width: 100%; }
    td, th { border-bottom: 1px solid #ddd; padding: .5rem; text-align: left; }
    button { background: #0b6e8a; color: #fff; border: 0; padding: .35rem .8rem; border-radius: .3rem; cursor: pointer; }
    .pie { color: #667; font-size: .9rem; margin-top: 2rem; }
  </style>
</head>
<body>
  <h1>🚲 BiciAlacant</h1>
  <p>Estaciones de bicicletas de la ciudad. Pulsa «Alquilar» para coger una bici.</p>
  <table>
    <thead><tr><th>Estación</th><th>Barrio</th><th>Bicis libres</th><th></th></tr></thead>
    <tbody id="estaciones"><tr><td colspan="4">Cargando…</td></tr></tbody>
  </table>
  <p class="pie" id="pie"></p>
  <script>
    async function cargar() {
      const tb = document.getElementById('estaciones');
      try {
        const r = await fetch('/api/estaciones');
        if (!r.ok) throw new Error(r.status);
        const datos = await r.json();
        tb.innerHTML = datos.map(e =>
          `<tr><td>${e.nombre}</td><td>${e.barrio}</td><td>${e.bicis_libres}</td>
           <td><button onclick="alquilar(${e.id})">Alquilar</button></td></tr>`).join('');
      } catch (err) {
        tb.innerHTML = `<tr><td colspan="4">No se puede contactar con la API (${err.message}).</td></tr>`;
      }
      try {
        const i = await (await fetch('/api/info')).json();
        const v = await (await fetch('/api/visitas')).json();
        document.getElementById('pie').textContent =
          `API v${i.version} · respondió el contenedor ${i.contenedor} · visitas: ${v.visitas ?? '—'}`;
      } catch (e) { /* la caché puede no estar disponible */ }
    }
    async function alquilar(id) {
      const r = await fetch(`/api/alquiler/${id}`, { method: 'POST' });
      if (!r.ok) alert((await r.json()).error);
      cargar();
    }
    cargar();
  </script>
</body>
</html>
