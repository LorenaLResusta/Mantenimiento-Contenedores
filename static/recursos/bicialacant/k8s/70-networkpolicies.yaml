# Políticas de red (UD05). Necesitan un CNI que las aplique (Calico, Cilium...).
# 1) Todo denegado por defecto en el espacio de nombres
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: denegar-todo
  namespace: bicialacant
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# 2) Todos los Pods pueden resolver nombres (DNS del clúster)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: permitir-dns
  namespace: bicialacant
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
# 3) El frontal recibe tráfico del controlador de entrada y habla solo con la API
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web
  namespace: bicialacant
spec:
  podSelector:
    matchLabels: {app: web}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: traefik}
      ports: [{port: 8080}]
  egress:
    - to:
        - podSelector: {matchLabels: {app: api}}
      ports: [{port: 8000}]
---
# 4) La API recibe del frontal y habla con la base de datos y la caché
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api
  namespace: bicialacant
spec:
  podSelector:
    matchLabels: {app: api}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: web}}
      ports: [{port: 8000}]
  egress:
    - to:
        - podSelector: {matchLabels: {app: db}}
      ports: [{port: 5432}]
    - to:
        - podSelector: {matchLabels: {app: cache}}
      ports: [{port: 6379}]
---
# 5) Los datos solo aceptan conexiones de la API
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: datos
  namespace: bicialacant
spec:
  podSelector:
    matchLabels: {tier: datos}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: api}}
