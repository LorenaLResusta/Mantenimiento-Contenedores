# PostgreSQL como StatefulSet con almacenamiento persistente (UD03-UD04)
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: bicialacant
  labels: {app: db}
spec:
  clusterIP: None            # Service «headless»: DNS estable para el StatefulSet
  selector: {app: db}
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: bicialacant
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels: {app: db}
  template:
    metadata:
      labels: {app: db, tier: datos}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70          # usuario postgres de la imagen alpine
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: bicialacant
            - name: POSTGRES_USER
              value: bici
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: db-cred, key: password}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: datos
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
            - name: run
              mountPath: /var/run/postgresql
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "bici", "-d", "bicialacant"]
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
      volumes:
        - name: init
          configMap: {name: db-init}
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: datos
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
