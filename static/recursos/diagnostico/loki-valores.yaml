# Loki en modo monolítico (un solo Pod) para el laboratorio (práctica 3.1).
#   helm repo add grafana https://grafana.github.io/helm-charts
#   helm install loki grafana/loki -n monitorizacion -f loki-valores.yaml
# En producción real se usa almacenamiento de objetos (S3) y varios Pods; aquí basta un volumen.
deploymentMode: SingleBinary
loki:
  auth_enabled: false            # un solo inquilino; el acceso se protege con la red (solo desde el clúster)
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: {prefix: loki_index_, period: 24h}
  limits_config:
    retention_period: 168h       # 7 días, igual que Prometheus
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    allow_deletes: true          # permite borrar registros por consulta (UD05, baja del servicio)
  compactor:
    retention_enabled: true      # sin esto, retention_period no borra nada
    delete_request_store: filesystem
    delete_request_cancel_period: 10m   # por defecto 24 h: plazo para cancelar un borrado antes de ejecutarlo
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
# Componentes del modo distribuido y extras que no se usan en el laboratorio
backend: {replicas: 0}
read: {replicas: 0}
write: {replicas: 0}
gateway: {enabled: false}
chunksCache: {enabled: false}
resultsCache: {enabled: false}
lokiCanary: {enabled: false}
test: {enabled: false}
